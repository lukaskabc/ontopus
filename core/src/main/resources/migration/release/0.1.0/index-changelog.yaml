# yaml-language-server: $schema=https://raw.githubusercontent.com/kbss-cvut/ontology-migration-tool/refs/heads/main/src/main/resources/changelog-scheme.json

changelog:
  - changeSet:
      # Verify that catalog is not too old for migration (if localhost catalog exists, the new system uri based must exist as well)
      id: v0.1.0_00
      changes:
        - type: custom
          class: cz.lukaskabc.ontology.ontopus.core.service.migration.release.v0_1_0.EnsureSystemUriBasedCatalogExists

  - changeSet:
      # Migrate dcelements:language to dcterms
      id: v0.1.0_01
      changes:
        - type: renameResource
          oldIri: "http://purl.org/dc/elements/1.1/language"
          newIri: "http://purl.org/dc/terms/language"
          graph: "http://ontology.lukaskabc.cz/application/ontopus/VersionSeries"
        - type: renameResource
          oldIri: "http://purl.org/dc/elements/1.1/language"
          newIri: "http://purl.org/dc/terms/language"
          graph: "http://ontology.lukaskabc.cz/application/ontopus/VersionArtifact"

  - changeSet:
      # Move serializedImportContexts into standalone graph
      # VersionSeries graph is now public and must not contain sensitive information
      id: v0.1.0_02
      changes:
        - type: sparqlUpdate
          query: |
            PREFIX ontopus: <http://ontology.lukaskabc.cz/application/ontopus/>
            DELETE {
              GRAPH ontopus:VersionSeries {
                ?s ontopus:serializedImportContext ?o .
              }
            }
            INSERT {
              GRAPH ontopus:serializedImportContext {
                ?s ontopus:serializedImportContext ?o .
              }
            }
            WHERE {
              GRAPH ontopus:VersionSeries {
                ?s ontopus:serializedImportContext ?o .
              }
            }

  - changeSet:
      # Migrate custom hasPrefixDeclaration predicate to standard shacl declare predicate
      id: v0.1.0_03
      changes:
        - type: renameResource
          oldIri: "http://ontology.lukaskabc.cz/application/ontopus/hasPrefixDeclaration"
          newIri: "http://www.w3.org/ns/shacl#declare"
          graph: "http://ontology.lukaskabc.cz/application/ontopus/VersionArtifact"

  - changeSet:
      # Migrate identifiers from systemURI based to new explicit setting
      id: v0.1.0_04
      changes:
        - type: custom
          class: cz.lukaskabc.ontology.ontopus.core.service.migration.release.v0_1_0.OutOfLocalhostCatalogMigrationChange

  - changeSet:
      # Delete old localhost based catalog
      id: v0.1.0_05
      changes:
        - type: deleteResource
          iri: "http://localhost/ontopus/catalog"
          graph: "http://ontology.lukaskabc.cz/application/ontopus/OntopusCatalog"

  - changeSet:
      # Remove catalog agent orphans
      id: v0.1.0_06
      changes:
        - type: sparqlUpdate
          query: |
            PREFIX ontopus: <http://ontology.lukaskabc.cz/application/ontopus/>
            PREFIX foaf: <http://xmlns.com/foaf/0.1/>
            
            DELETE {
              GRAPH ontopus:OntopusCatalog {
              ?agent ?p ?s .
              }
            } WHERE {
              GRAPH ontopus:OntopusCatalog {
                ?catalog a ontopus:OntopusCatalog .
                ?agent a foaf:Agent ;
                ?p ?s .
                
                FILTER NOT EXISTS {
                  ?catalog ?hasAgent ?agent .
                }
              }
            }
